<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lusei Entertainment — Sep–Dec 2026</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --ink:#172033; --muted:#64748b; --line:#dbe2ea; --panel:#ffffff;
    --bg:#f5f7fa; --accent:#1d4ed8; --done:#15803d; --todo:#b45309;
    --j6:#dbeafe; --j6b:#2563eb; --ems:#dcfce7; --emsb:#16a34a;
    --ih:#fef3c7; --ihb:#d97706; --mbm:#f3e8ff; --mbmb:#9333ea;
    --tv:#e0e7ff; --tvb:#4f46e5;
  }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); }
  button, input, textarea, select { font:inherit; }
  button { cursor:pointer; }
  .app { max-width:1500px; margin:0 auto; padding:20px; }
  header {
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:18px 20px; margin-bottom:16px; box-shadow:0 4px 18px rgba(15,23,42,.05);
  }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  h1 { margin:0 0 5px; font-size:28px; }
  .subtitle { color:var(--muted); font-size:14px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn {
    border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px;
    padding:9px 12px; font-weight:600;
  }
  .btn:hover { background:#f8fafc; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .legend { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#475569; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .toolbar {
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom:12px;
  }
  .month-tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tab {
    border:1px solid var(--line); background:#fff; border-radius:9px; padding:8px 12px;
    font-weight:700; color:#475569;
  }
  .tab.active { background:#172033; color:#fff; border-color:#172033; }
  .hint { color:var(--muted); font-size:12px; }
  .calendar {
    background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 4px 18px rgba(15,23,42,.05);
  }
  .weekdays { display:grid; grid-template-columns:repeat(7,1fr); background:#f8fafc; border-bottom:1px solid var(--line); }
  .weekday { padding:10px 8px; font-size:12px; font-weight:800; color:#64748b; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); }
  .cell {
    min-height:145px; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:8px; position:relative; background:#fff;
  }
  .cell:nth-child(7n) { border-right:0; }
  .cell.empty { background:#fafbfc; }
  .cell.holiday { background:#fffaf3; }
  .date { font-size:13px; font-weight:800; margin-bottom:7px; color:#334155; }
  .holiday-label { font-size:10px; color:#b45309; font-weight:700; margin-left:5px; }
  .bar {
    width:100%; border:0; border-left:4px solid; border-radius:6px; margin:4px 0;
    padding:6px 7px; text-align:left; font-size:11px; line-height:1.25; font-weight:700;
    color:#1e293b; overflow:hidden;
  }
  .bar:hover { filter:brightness(.97); outline:1px solid rgba(15,23,42,.15); }
  .bar.j6 { background:var(--j6); border-color:var(--j6b); }
  .bar.ems { background:var(--ems); border-color:var(--emsb); }
  .bar.ih { background:var(--ih); border-color:var(--ihb); }
  .bar.mbm { background:var(--mbm); border-color:var(--mbmb); }
  .bar.tv { background:var(--tv); border-color:var(--tvb); }
  .status { display:inline-block; margin-top:3px; font-size:9px; text-transform:uppercase; letter-spacing:.4px; opacity:.72; }
  .done .status { color:var(--done); } .todo .status { color:var(--todo); }
  .note { margin-top:10px; padding:9px 11px; border-radius:9px; background:#f8fafc; border:1px solid var(--line); color:#64748b; font-size:12px; }
  .modal-backdrop {
    display:none; position:fixed; inset:0; background:rgba(15,23,42,.42); z-index:20;
    align-items:center; justify-content:center; padding:18px;
  }
  .modal-backdrop.open { display:flex; }
  .modal { background:#fff; width:min(650px,100%); max-height:90vh; overflow:auto; border-radius:14px; padding:20px; box-shadow:0 20px 60px rgba(15,23,42,.25); }
  .modal h2 { margin:0 0 14px; font-size:20px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; font-weight:800; color:#475569; margin-bottom:5px; }
  .field input, .field textarea, .field select {
    width:100%; border:1px solid var(--line); border-radius:8px; padding:9px; background:#fff;
  }
  .field textarea { min-height:100px; resize:vertical; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .danger { color:#b91c1c; border-color:#fecaca; }
  .footer { padding:14px 2px 0; color:#64748b; font-size:11px; text-align:center; }
  @media (max-width:900px) {
    .cell { min-height:120px; padding:6px; }
    .bar { font-size:10px; }
  }
  @media (max-width:650px) {
    .app { padding:10px; }
    .calendar { overflow-x:auto; }
    .weekdays, .grid { min-width:900px; }
    .toolbar { align-items:flex-start; }
  }
  @media print {
    body { background:#fff; }
    .app { max-width:none; padding:0; }
    header { box-shadow:none; }
    .actions, .month-tabs, .hint, .footer { display:none; }
    .calendar { box-shadow:none; }
    .cell { min-height:125px; }
  }
</style>
</head>

</div>

function pad(n) { return String(n).padStart(2,'0'); }
function iso(monthIndex, day) {
  const year = 2026;
  const month = monthIndex + 9;
  return `${year}-${pad(month)}-${pad(day)}`;
}
function monthIndexFromName(name) { return data.months.findIndex(m => m.name === name); }

function flattenEvents(monthIndex) {
  const month = data.months[monthIndex];
  const events = [];
  month.weeks.forEach((week, wi) => {
    (week.bars || []).forEach(bar => {
      const start = week.dates[bar.startCol-1];
      const end = week.dates[bar.endCol-1];
      if (typeof start === "number") {
        events.push({...bar, monthIndex, weekIndex:wi, startDay:start, endDay: typeof end==="number"?end:start});
      }
    });
  });
  return events;
}

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = data.months.map((m,i) =>
    `<button class="tab ${i===activeMonth?'active':''}" onclick="showMonth(${i})">${m.name}</button>`
  ).join("");
}

function renderCalendar() {
  renderTabs();
  const month = data.months[activeMonth];
  let out = `<div class="calendar"><div class="weekdays">
    <div class="weekday">Mon</div><div class="weekday">Tue</div><div class="weekday">Wed</div>
    <div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div><div class="weekday">Sun</div>
  </div><div class="grid">`;

  month.weeks.forEach((week, wi) => {
    for (let c=0;c<7;c++) {
      const val = week.dates[c];
      if (val == null) {
        out += `<div class="cell empty"></div>`;
        continue;
      }
      const day = typeof val === "object" ? val.n : val;
      const holiday = typeof val === "object" && val.hol;
      const events = (week.bars || []).filter(b => b.startCol-1 <= c && b.endCol-1 >= c);
      out += `<div class="cell ${holiday?'holiday':''}" data-week="${wi}" data-col="${c}">
        <div class="date">${day}${holiday?'<span class="holiday-label">Holiday</span>':''}</div>`;
      events.forEach(b => {
        const first = b.startCol-1 === c;
        out += `<button class="bar ${b.color} ${b.status}" onclick="editEvent('${b.id}',${activeMonth},${wi})">
          ${first ? htmlEscape(b.label) : '&nbsp;'}
          <div class="status">${b.status === 'done' ? '✓ Done' : '○ To-do'}</div>
        </button>`;
      });
      out += `</div>`;
    }
  });
  out += `</div></div>`;
  if (month.note) out += `<div class="note"><strong>Planning note:</strong> ${htmlEscape(month.note)}</div>`;
  document.getElementById("calendar").innerHTML = out;
}

function htmlEscape(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

function showMonth(i) { activeMonth=i; renderCalendar(); }

function editEvent(id, mi, wi) {
  const b = data.months[mi].weeks[wi].bars.find(x => x.id === id);
  if (!b) return;
  editing = {id, mi, wi};
  document.getElementById("modalTitle").textContent = "Edit Task";
  document.getElementById("fLabel").value = b.label || "";
  document.getElementById("fColor").value = b.color || "j6";
  document.getElementById("fStatus").value = b.status || "todo";
  const week = data.months[mi].weeks[wi];
  const sd = week.dates[b.startCol-1];
  const ed = week.dates[b.endCol-1];
  document.getElementById("fStart").value = typeof sd === "number" ? iso(mi,sd) : "";
  document.getElementById("fEnd").value = typeof ed === "number" ? iso(mi,ed) : "";
  document.getElementById("fDetail").value = b.detail || "";
  document.getElementById("deleteBtn").style.display = "";
  document.getElementById("modal").classList.add("open");
}

function addEvent() {
  editing = null;
  document.getElementById("modalTitle").textContent = "Add Task";
  document.getElementById("fLabel").value = "";
  document.getElementById("fColor").value = "j6";
  document.getElementById("fStatus").value = "todo";
  document.getElementById("fStart").value = "2026-10-01";
  document.getElementById("fEnd").value = "2026-10-01";
  document.getElementById("fDetail").value = "";
  document.getElementById("deleteBtn").style.display = "none";
  document.getElementById("modal").classList.add("open");
}

function closeModal() { document.getElementById("modal").classList.remove("open"); }

function saveEvent() {
  const label = document.getElementById("fLabel").value.trim();
  const color = document.getElementById("fColor").value;
  const status = document.getElementById("fStatus").value;
  const start = document.getElementById("fStart").value;
  const end = document.getElementById("fEnd").value;
  const detail = document.getElementById("fDetail").value.trim();
  if (!label || !start || !end) { alert("Please enter a task, start date and end date."); return; }

  if (editing) {
    const b = data.months[editing.mi].weeks[editing.wi].bars.find(x => x.id === editing.id);
    b.label=label; b.color=color; b.status=status; b.detail=detail;
  } else {
    // Add to the week containing the start date.
    const d = new Date(start + "T00:00:00");
    const mi = d.getMonth() - 8; // Sep=0
    if (mi < 0 || mi >= data.months.length) { alert("Date must be between Sep and Dec 2026."); return; }
    const day = d.getDate();
    const month = data.months[mi];
    const wi = month.weeks.findIndex(w => w.dates.some(x => (typeof x==="number" ? x : x?.n) === day));
    if (wi < 0) { alert("Could not place this date."); return; }
    const week = month.weeks[wi];
    const col = week.dates.findIndex(x => (typeof x==="number" ? x : x?.n) === day) + 1;
    week.bars = week.bars || [];
    week.bars.push({
      id: Math.random().toString(36).slice(2,12), label, color, status,
      startCol:col, endCol:col, detail, segs:null
    });
    activeMonth=mi;
  }
  persist(); closeModal(); renderCalendar();
}

function deleteEvent() {
  if (!editing) return;
  if (!confirm("Delete this task?")) return;
  const w = data.months[editing.mi].weeks[editing.wi];
  w.bars = (w.bars || []).filter(x => x.id !== editing.id);
  persist(); closeModal(); renderCalendar();
}

function persist() {
  localStorage.setItem("luseiCalendarData", JSON.stringify(data));
}

function download(filename, content, type) {
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function downloadJSON() {
  download("lusei-calendar-export.json", JSON.stringify(data,null,2), "application/json");
}

function downloadICS() {
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lusei Entertainment//Self-contained Calendar//EN","CALSCALE:GREGORIAN"];
  data.months.forEach((m,mi) => {
    flattenEvents(mi).forEach(e => {
      const start = iso(mi,e.startDay).replaceAll("-","");
      const end = iso(mi,e.endDay+1).replaceAll("-","");
      lines.push("BEGIN:VEVENT");
      lines.push("UID:" + e.id + "@lusei-calendar");
      lines.push("DTSTART;VALUE=DATE:" + start);
      lines.push("DTEND;VALUE=DATE:" + end);
      lines.push("SUMMARY:" + String(e.label).replace(/[\\,;\n]/g," "));
      if (e.detail) lines.push("DESCRIPTION:" + String(e.detail).replace(/[\\,;\n]/g," "));
      lines.push("END:VEVENT");
    });
  });
  lines.push("END:VCALENDAR");
  download("lusei-entertainment-calendar.ics", lines.join("\r\n"), "text/calendar");
}

renderCalendar();
</script>
